<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><meta name="theme-color" content="#030911"><title>NEXUS — Attention Center</title><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/nexus.css"><link rel="stylesheet" href="/nexus-v2.css"></head><body><div class="shell"><aside class="sidebar"><div class="brand"></div><nav class="nav-list" aria-label="Primary"></nav><div class="sidebar-foot"><div class="identity"><div class="identity-name">Secure session</div><div class="identity-meta">Governed decisions</div></div></div></aside><div class="main"><header class="topbar"><div><div class="page-title">Attention Center</div><div class="page-sub">Approvals, warnings, recommendations and decision context</div></div><div class="context"><span id="securityBadge" class="security demo">Checking live access…</span></div></header><div id="nexusRibbon" class="nexus-ribbon"></div><main class="content nexus-attention"><section id="inboxView" class="inbox"><div class="summary"><div class="stat hot"><div id="actionCount" class="n">—</div><div class="l">Action Required</div></div><div class="stat"><div id="watchCount" class="n">—</div><div class="l">Watch</div></div><div class="stat"><div id="infoCount" class="n">—</div><div class="l">Info Only</div></div><div class="stat"><div id="totalCount" class="n">—</div><div class="l">Total</div></div></div><div id="filters" class="filters"></div><div id="attentionList" class="list"></div></section><section id="detailView" class="detail"><button id="backButton" class="back">‹ Back to Attention</button><div class="detail-card"><div class="detail-head"><div id="detailIcon" class="icon">T</div><div><div id="detailDomain" class="domain">Treasury</div><div id="detailTime" class="time" style="margin:3px 0 0">—</div></div><span id="detailSeverity" class="pill high
