name: SAGE Nexus Public Release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sage-public-release.yml
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sage-nexus-public-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify certified transport chunks
        shell: bash
        run: |
          set -euo pipefail
          test "$(find bundle -maxdepth 1 -name 'part-*.txt' | wc -l)" -eq 7
          cat >/tmp/chunk-sums <<'SUMS'
          10cd2b7d3f226740368960f8e0dbe2d9abd08673f8a39e6f5563c0c3df427fcc  bundle/part-00.txt
          f888b2280ed7ab5c1395ed5ec329acfb87ce88bb93edb2961e716f4a796ffa54  bundle/part-01.txt
          9f84a95bed9fce71a6e1686bd1ed22694f16bd0b7550c6f4a10f082f78a8266c  bundle/part-02.txt
          61b22dfe32c7c9b10ab8c5b02dc4b66ae287aa921a55906d0ddd7b7e2d48474c  bundle/part-03.txt
          dc8712f4f17ab41743025abe7b069b119ca79aee1462482ee9f86bda83aa47e7  bundle/part-04.txt
          50fd258d8c310f6d1865811315c7052c124f4bd3079ab6f5c014e66476dd77a2  bundle/part-05.txt
          0b7c3684509b19f897fbaf15b53ebe4f8f1441b3225bf24b8a4d45c208c79a79  bundle/part-06.txt
          SUMS
          sha256sum -c /tmp/chunk-sums

      - name: Reconstruct certified SAGE browser artifact
        shell: bash
        run: |
          set -euo pipefail
          cat bundle/part-*.txt | base64 -d > /tmp/sage-nexus-public-browser.zip
          echo '5f73c3fc5da661e14d13dfe0fc1a0745ade78acc8dfe64c172831ef274588990  /tmp/sage-nexus-public-browser.zip' | sha256sum -c -
          rm -rf /tmp/site
          mkdir -p /tmp/site
          unzip -q /tmp/sage-nexus-public-browser.zip -d /tmp/site

      - name: Verify SAGE public browser contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat /tmp/site/SOURCE_SHA)" = 'fffb7d6c3fef52e91015343ac644df65b2929629'
          test "$(cat /tmp/site/BROWSER_CONTRACT)" = 'sage.nexus.browser.public.v1'
          test "$(cat /tmp/site/PUBLIC_DEPLOYMENT_REPOSITORY)" = 'mcchu8-lp.github.io'
          sed 's#dist/browser/##g' /tmp/site/SHA256SUMS > /tmp/sage-browser-sums
          (cd /tmp/site && sha256sum -c /tmp/sage-browser-sums)
          ! grep -R -E 'sb_secret_|SUPABASE_SERVICE_ROLE_KEY|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY' /tmp/site
          test -f /tmp/site/index.html
          test -f /tmp/site/nexus.js
          for f in /tmp/site/*.js; do node --check "$f"; done

      - name: Materialize certified browser release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bundle
          rm -f sage-nexus-public-browser.zip.b64
          cp -a /tmp/site/. .
          touch .nojekyll
          git config user.name 'SAGE Release Bot'
          git config user.email 'sage-release@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'Publish certified SAGE Nexus browser artifact fffb7d6c'
            git push origin HEAD:main
          fi

      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/site

  deploy:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure public GitHub Pages transport
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Deploy verified SAGE browser artifact
        id: deployment
        uses: actions/deploy-pages@v4
